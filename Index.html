<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ই-কমার্স শপ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার বা নেভিগেশন বার -->
    <header>
        <div class="logo">ই-শপ</div>
        <nav>
            <a href="#">হোম</a>
            <a href="#">প্রোডাক্ট</a>
            <a href="#">যোগাযোগ</a>
        </nav>
    </header>

    <!-- হিরো সেকশন -->
    <section class="hero">
        <h1>অনলাইন শপিং এখন আরও সহজ</h1>
        <p>আপনার পছন্দের পণ্যটি কিনুন ঘরে বসেই</p>
        <button class="btn">কেনাকাটা শুরু করুন</button>
    </section>

    <!-- প্রোডাক্ট সেকশন -->
    <section class="products">
        <h2>জনপ্রিয় প্রোডাক্টসমূহ</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://placeholder.com" alt="প্রোডাক্ট">
                <h3>স্টাইলিশ শার্ট</h3>
                <p>৳ ৫০০</p>
                <button class="btn">কার্ডে যোগ করুন</button>
            </div>
            <div class="product-card">
                <img src="https://placeholder.com" alt="প্রোডাক্ট">
                <h3>আরামদায়ক জুতো</h3>
                <p>৳ ১২০০</p>
                <button class="btn">কার্ডে যোগ করুন</button>
            </div>
        </div>
    </section>

    <!-- ফুটার -->
    <footer>
        <p>&copy; ২০২৬ ই-শপ। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

</body>
</html>
